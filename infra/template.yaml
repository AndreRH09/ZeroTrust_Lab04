AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  Plataforma de Donaciones Seguras (Fundación AQP-SOLIDARIA) - prototipo académico Zero Trust.
  DynamoDB, Cognito (MFA TOTP + trigger Pre authentication), HTTP API con JWT authorizer,
  una función Lambda por caso de uso con rol IAM propio, S3 privado + CloudFront (OAC + cabeceras
  de seguridad) y, opcionalmente, Amazon Verified Permissions (HU-12).

# Trazabilidad: RNF-HU-02, RNF-HU-03, RNF-HU-04, CA-03.1, CA-03.3, CA-11.1, CA-NF02.1, CA-NF08.2
# Región objetivo: us-east-2 (research R-01). Sin Account ID ni secretos en este archivo.

Parameters:
  Stage:
    Type: String
    Default: academic
    AllowedValues: [academic]
    Description: >-
      Único stage permitido. La ruta de simulación solo existe cuando Stage = academic (CA-06.1).
  CognitoDomainPrefix:
    Type: String
    Default: zerotrust-lab04-aqp
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,62}[a-z0-9]$"
    Description: >-
      Prefijo del dominio de Cognito (managed login). Debe ser único en la región; si ya está
      tomado, cambiarlo al desplegar.
  WebOrigin:
    Type: String
    Default: ""
    Description: >-
      Origen HTTPS del frontend (por ejemplo https://dxxxx.cloudfront.net). Vacío hasta T094; con
      valor, se añade a las URLs de retorno de Cognito y a CORS. scripts/deploy-api.sh lo
      completa automáticamente con la URL de CloudFront en un segundo despliegue.
  EnableAvp:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Extensión HU-12. "true" crea un policy store de Verified Permissions con las políticas Cedar y
      cambia AUTHZ_ENGINE a avp en las funciones protegidas.

Conditions:
  IsAcademic: !Equals [!Ref Stage, academic]
  HasWebOrigin: !Not [!Equals [!Ref WebOrigin, ""]]
  UseAvp: !Equals [!Ref EnableAvp, "true"]

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        STACK_ID: !Ref AWS::StackId
        PROJECTS_TABLE: !Ref ProjectsTable
        DONATIONS_TABLE: !Ref DonationsTable
        IDEMPOTENCY_TABLE: !Ref IdempotencyTable
        AUDIT_TABLE: !Ref AuditEventsTable
        AUTHZ_ENGINE: !If [UseAvp, avp, embedded]
        AVP_POLICY_STORE_ID: !If [UseAvp, !Ref AvpPolicyStore, ""]

Resources:
  # ---------------------------------------------------------------------------
  # T025 - DynamoDB (on-demand, cifrado en reposo por defecto, sin streams)
  # Modelo: specs/001-donaciones-seguras/data-model.md
  # ---------------------------------------------------------------------------
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: false # permite `sam delete` (CA-NF08.2, CA-NF09.2)
      AttributeDefinitions:
        - { AttributeName: projectId, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: projectId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: status-createdAt
          KeySchema:
            - { AttributeName: status, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  DonationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: false
      AttributeDefinitions:
        - { AttributeName: donationId, AttributeType: S }
        - { AttributeName: donorSub, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: S }
      KeySchema:
        - { AttributeName: donationId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: donorSub-createdAt
          KeySchema:
            - { AttributeName: donorSub, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  IdempotencyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: false
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expiresAt # 24 h desde el primer uso (research R-07)
        Enabled: true

  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: false
      AttributeDefinitions:
        - { AttributeName: eventType, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: eventType, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }

  # ---------------------------------------------------------------------------
  # T026 - Cognito (research R-02, R-03)
  # MFA OPTIONAL a nivel de pool + trigger PreAuthentication (T027) que bloquea a GESTOR y
  # AUDITOR sin TOTP. Solo TOTP: sin SMS (CA-11.1).
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      DeletionProtection: INACTIVE # permite eliminar la pila (CA-NF09.2)
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: OPTIONAL
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 3
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true # usuarios de prueba creados por el equipo (T030)
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      Schema:
        - { Name: email, AttributeDataType: String, Required: true, Mutable: true }
      LambdaConfig:
        PreAuthentication: !GetAtt PreAuthFn.Arn # T027: bloquea GESTOR/AUDITOR sin TOTP

  GroupDonante:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: DONANTE
      Description: Puede crear intenciones de donación simuladas y ver su historial.

  GroupGestor:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: GESTOR
      Description: Crea, edita y publica proyectos. MFA TOTP obligatorio.

  GroupAuditor:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: AUDITOR
      Description: Consulta eventos de auditoría. MFA TOTP obligatorio.

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: api
      Name: Donaciones API
      Scopes:
        - { ScopeName: projects.write, ScopeDescription: "Crear, editar y publicar proyectos" }
        - { ScopeName: donations.write, ScopeDescription: "Crear y simular donaciones propias" }
        - { ScopeName: donations.read, ScopeDescription: "Leer el historial propio" }
        - { ScopeName: audit.read, ScopeDescription: "Consultar eventos de auditoría" }

  # App client público de la SPA: Authorization Code + PKCE, sin secreto (CA-03.1).
  # No concede aws.cognito.signin.user.admin: el usuario no puede desactivar su propio MFA.
  SpaClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: spa-public
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true # CA-03.3
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes:
        - openid
        - email
        - api/projects.write
        - api/donations.write
        - api/donations.read
        - api/audit.read
      SupportedIdentityProviders: [COGNITO]
      # Con la rotación del refresh token activada, Cognito no admite ALLOW_REFRESH_TOKEN_AUTH
      # (error de despliegue del 2026-11-11, ver docs/aws-account.md §9): el refresco se hace
      # con el grant refresh_token del flujo OAuth. Sin ALLOW_USER_PASSWORD_AUTH (T016).
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH]
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: minutes
      AccessTokenValidity: 15 # ≤ 15 min (CA-03.3, AD-07)
      IdTokenValidity: 15
      RefreshTokenValidity: 60
      RefreshTokenRotation:
        Feature: ENABLED
        RetryGracePeriodSeconds: 0
      CallbackURLs: !If
        - HasWebOrigin
        - ["http://localhost:5173/callback", !Sub "${WebOrigin}/callback"]
        - ["http://localhost:5173/callback"]
      LogoutURLs: !If
        - HasWebOrigin
        - ["http://localhost:5173/", !Sub "${WebOrigin}/"]
        - ["http://localhost:5173/"]

  # App client administrativo: sin OAuth, solo para enrolar TOTP de GESTOR/AUDITOR con
  # credenciales IAM del equipo (T030). No lo usa la SPA.
  AdminCliClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: admin-cli
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows: [ALLOW_ADMIN_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix

  # ---------------------------------------------------------------------------
  # T028 - HTTP API = Policy Enforcement Point (design §6.1)
  # El JWT authorizer valida emisor, firma, expiración y client_id (los access tokens de
  # Cognito no llevan `aud`; API Gateway compara `audience` con `aud` o `client_id`).
  # Cada ruta protegida declara Auth.Authorizer y AuthorizationScopes en su función
  # (T042 y siguientes): un ID token no tiene `scope`, por eso es rechazado (CA-NF02.1, T11).
  # No se define DefaultAuthorizer: las rutas públicas (GET /v1/projects...) no llevan authorizer.
  # ---------------------------------------------------------------------------
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14 # CA-NF07.1

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      Auth:
        Authorizers:
          JwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref SpaClient
      DefaultRouteSettings:
        ThrottlingRateLimit: 20 # solicitudes por segundo (research R-06)
        ThrottlingBurstLimit: 40
      # El !If va sobre la CorsConfiguration completa, no dentro de AllowOrigins: SAM copiaba el
      # Fn::If de AllowOrigins como si fuera todo el bloque x-amazon-apigateway-cors y API Gateway
      # lo ignoraba (la API desplegada quedó con cors = null; ver docs/aws-account.md §9).
      CorsConfiguration: !If
        - HasWebOrigin
        - AllowOrigins: ["http://localhost:5173", !Ref WebOrigin]
          AllowMethods: [GET, POST, PATCH, OPTIONS]
          AllowHeaders: [Authorization, Content-Type, Idempotency-Key]
          MaxAge: 600
        - AllowOrigins: ["http://localhost:5173"]
          AllowMethods: [GET, POST, PATCH, OPTIONS]
          AllowHeaders: [Authorization, Content-Type, Idempotency-Key]
          MaxAge: 600
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        # JSON sin Authorization, tokens ni sub (CA-NF01.2, CA-NF07.1)
        Format: >-
          {"requestId":"$context.requestId","routeKey":"$context.routeKey","status":"$context.status","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationLatency":"$context.integrationLatency","authorizerError":"$context.authorizer.error"}

  # ---------------------------------------------------------------------------
  # T027 - Trigger Pre authentication (research R-02)
  # Excepción IAM justificada: el ARN del user pool no puede referenciarse en la política del
  # trigger sin dependencia circular (pool → trigger → rol → pool), por eso el recurso es
  # userpool/* limitado a la cuenta y región, y solo con dos acciones de lectura.
  # ---------------------------------------------------------------------------
  PreAuthLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  PreAuthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt PreAuthLogGroup.Arn
        - PolicyName: cognito-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [cognito-idp:AdminGetUser, cognito-idp:AdminListGroupsForUser]
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"

  PreAuthFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Pre authentication - MFA TOTP obligatorio para GESTOR y AUDITOR (CA-11.2)
      CodeUri: ../backend/dist/preAuth
      Handler: index.handler
      Role: !GetAtt PreAuthRole.Arn
      LoggingConfig: { LogGroup: !Ref PreAuthLogGroup }

  PreAuthInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreAuthFn.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ---------------------------------------------------------------------------
  # Funciones de la API (research R-05). Cada una con rol propio, solo las acciones DynamoDB y
  # ARN de tabla/índice que necesita (CA-NF03.1, T10) y log group con retención 14 días.
  # Las rutas protegidas exigen JwtAuthorizer + scope (PEP); grupo y propietario se validan en
  # Lambda (PE).
  # ---------------------------------------------------------------------------

  # T042, T046, T055 - lectura pública (no puede escribir: T10)
  PublicProjectsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  PublicProjectsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt PublicProjectsLogGroup.Arn
        - PolicyName: projects-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !GetAtt ProjectsTable.Arn
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub "${ProjectsTable.Arn}/index/status-createdAt"

  PublicProjectsFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Catálogo, detalle e indicadores públicos (HU-01, HU-02, HU-09)
      CodeUri: ../backend/dist/publicProjects
      Handler: index.handler
      Role: !GetAtt PublicProjectsRole.Arn
      LoggingConfig: { LogGroup: !Ref PublicProjectsLogGroup }
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/projects
        Detail:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/projects/{projectId}
        Stats:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/projects/{projectId}/stats

  # T051 - gestión de proyectos (GESTOR)
  ManageProjectsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ManageProjectsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ManageProjectsLogGroup.Arn
        - PolicyName: projects-write
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt ProjectsTable.Arn
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub "${ProjectsTable.Arn}/index/status-createdAt"
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt AuditEventsTable.Arn
        - !If
          - UseAvp
          - PolicyName: avp
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: [verifiedpermissions:IsAuthorized]
                  Resource: !GetAtt AvpPolicyStore.Arn
          - !Ref AWS::NoValue

  ManageProjectsFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Crear, editar y publicar proyectos (HU-08)
      CodeUri: ../backend/dist/manageProjects
      Handler: index.handler
      Role: !GetAtt ManageProjectsRole.Arn
      LoggingConfig: { LogGroup: !Ref ManageProjectsLogGroup }
      Events:
        ListManage:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/manage/projects
            Auth: { Authorizer: JwtAuthorizer, AuthorizationScopes: [api/projects.write] }
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /v1/projects
            Auth: { Authorizer: JwtAuthorizer, AuthorizationScopes: [api/projects.write] }
        Update:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PATCH
            Path: /v1/projects/{projectId}
            Auth: { Authorizer: JwtAuthorizer, AuthorizationScopes: [api/projects.write] }
        Publish:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: PATCH
            Path: /v1/projects/{projectId}/publish
            Auth: { Authorizer: JwtAuthorizer, AuthorizationScopes: [api/projects.write] }

  # T063 - intención de donación
  CreateDonationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  CreateDonationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt CreateDonationLogGroup.Arn
        - PolicyName: donations-create
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
                Resource: !GetAtt ProjectsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt DonationsTable.Arn
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt IdempotencyTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt AuditEventsTable.Arn
        - !If
          - UseAvp
          - PolicyName: avp
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: [verifiedpermissions:IsAuthorized]
                  Resource: !GetAtt AvpPolicyStore.Arn
          - !Ref AWS::NoValue

  CreateDonationFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Intención de donación idempotente (HU-05)
      CodeUri: ../backend/dist/createDonation
      Handler: index.handler
      Role: !GetAtt CreateDonationRole.Arn
      LoggingConfig: { LogGroup: !Ref CreateDonationLogGroup }
      Events:
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /v1/donations
            Auth: { Authorizer: JwtAuthorizer, AuthorizationScopes: [api/donations.write] }

  # T079 - simulación: solo existe en el stage academic (CA-06.1)
  SimulateDonationLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsAcademic
    Properties:
      RetentionInDays: 14

  SimulateDonationRole:
    Type: AWS::IAM::Role
    Condition: IsAcademic
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt SimulateDonationLogGroup.Arn
        - PolicyName: donations-simulate
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt DonationsTable.Arn
              - Effect: Allow
                Action: [dynamodb:UpdateItem]
                Resource: !GetAtt ProjectsTable.Arn
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt AuditEventsTable.Arn
        - !If
          - UseAvp
          - PolicyName: avp
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: [verifiedpermissions:IsAuthorized]
                  Resource: !GetAtt AvpPolicyStore.Arn
          - !Ref AWS::NoValue

  SimulateDonationFn:
    Type: AWS::Serverless::Function
    Condition: IsAcademic
    Properties:
      Description: Simulación académica de confirmación/rechazo (HU-06)
      CodeUri: ../backend/dist/simulateDonation
      Handler: index.handler
      Role: !GetAtt SimulateDonationRole.Arn
      LoggingConfig: { LogGroup: !Ref SimulateDonationLogGroup }
      Events:
        Simulate:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: POST
            Path: /v1/donations/{donationId}/simulate
            Auth: { Authorizer: JwtAuthorizer, AuthorizationScopes: [api/donations.write] }

  # T068 - historial propio y donación por id
  ReadDonationsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ReadDonationsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ReadDonationsLogGroup.Arn
        - PolicyName: donations-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem]
                Resource: !GetAtt DonationsTable.Arn
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !Sub "${DonationsTable.Arn}/index/donorSub-createdAt"
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt AuditEventsTable.Arn
        - !If
          - UseAvp
          - PolicyName: avp
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: [verifiedpermissions:IsAuthorized]
                  Resource: !GetAtt AvpPolicyStore.Arn
          - !Ref AWS::NoValue

  ReadDonationsFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Historial propio y donación por id con control BOLA (HU-07)
      CodeUri: ../backend/dist/readDonations
      Handler: index.handler
      Role: !GetAtt ReadDonationsRole.Arn
      LoggingConfig: { LogGroup: !Ref ReadDonationsLogGroup }
      Events:
        Mine:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/donations/me
            Auth: { Authorizer: JwtAuthorizer, AuthorizationScopes: [api/donations.read] }
        ById:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/donations/{donationId}
            Auth: { Authorizer: JwtAuthorizer, AuthorizationScopes: [api/donations.read] }

  # T087 - auditoría (HU-10, extensión). Solo Query sobre AuditEvents.
  AuditLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  AuditRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt AuditLogGroup.Arn
        - PolicyName: audit-read
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource: !GetAtt AuditEventsTable.Arn
              # Una denegación (no AUDITOR) se registra como AUTHZ_DENIED.
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt AuditEventsTable.Arn
        - !If
          - UseAvp
          - PolicyName: avp
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action: [verifiedpermissions:IsAuthorized]
                  Resource: !GetAtt AvpPolicyStore.Arn
          - !Ref AWS::NoValue

  AuditFn:
    Type: AWS::Serverless::Function
    Properties:
      Description: Consulta de eventos de auditoría (HU-10)
      CodeUri: ../backend/dist/audit
      Handler: index.handler
      Role: !GetAtt AuditRole.Arn
      LoggingConfig: { LogGroup: !Ref AuditLogGroup }
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Method: GET
            Path: /v1/audit
            Auth: { Authorizer: JwtAuthorizer, AuthorizationScopes: [api/audit.read] }

  # ---------------------------------------------------------------------------
  # T092 - Amazon Verified Permissions (HU-12, extensión). Políticas en policies/*.cedar.
  # ---------------------------------------------------------------------------
  AvpPolicyStore:
    Type: AWS::VerifiedPermissions::PolicyStore
    Condition: UseAvp
    Properties:
      Description: Donaciones seguras - Policy Engine externo (HU-12)
      ValidationSettings: { Mode: "OFF" }

  AvpPolicyGestor:
    Type: AWS::VerifiedPermissions::Policy
    Condition: UseAvp
    Properties:
      PolicyStoreId: !Ref AvpPolicyStore
      Definition:
        Static:
          Description: GESTOR administra proyectos (CA-04.1, CA-08.1)
          Statement: |
            permit (
              principal in Aqp::Group::"GESTOR",
              action in [Aqp::Action::"projects:create", Aqp::Action::"projects:update",
                         Aqp::Action::"projects:publish", Aqp::Action::"projects:listManage"],
              resource
            );

  AvpPolicyDonante:
    Type: AWS::VerifiedPermissions::Policy
    Condition: UseAvp
    Properties:
      PolicyStoreId: !Ref AvpPolicyStore
      Definition:
        Static:
          Description: DONANTE crea, simula y consulta sus donaciones (CA-05.1, CA-07.1)
          Statement: |
            permit (
              principal in Aqp::Group::"DONANTE",
              action in [Aqp::Action::"donations:create", Aqp::Action::"donations:simulate",
                         Aqp::Action::"donations:readOwn", Aqp::Action::"donations:readById"],
              resource
            );

  AvpPolicyOwnership:
    Type: AWS::VerifiedPermissions::Policy
    Condition: UseAvp
    Properties:
      PolicyStoreId: !Ref AvpPolicyStore
      Definition:
        Static:
          Description: Solo el propietario accede a una donación (CA-07.2, BOLA)
          Statement: |
            forbid (
              principal,
              action in [Aqp::Action::"donations:simulate", Aqp::Action::"donations:readById"],
              resource is Aqp::Donation
            )
            unless { resource.donorSub == principal.sub };

  AvpPolicyAuditor:
    Type: AWS::VerifiedPermissions::Policy
    Condition: UseAvp
    Properties:
      PolicyStoreId: !Ref AvpPolicyStore
      Definition:
        Static:
          Description: AUDITOR consulta auditoría (CA-10.1)
          Statement: |
            permit (
              principal in Aqp::Group::"AUDITOR",
              action == Aqp::Action::"audit:read",
              resource
            );

  # ---------------------------------------------------------------------------
  # T094 - Frontend: S3 privado + CloudFront con OAC y response headers policy
  # (RNF-HU-01, RNF-HU-11, CA-NF01.1, CA-NF11.2). Sin Lambda@Edge.
  # ---------------------------------------------------------------------------
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'self';
              script-src 'self';
              style-src 'self';
              img-src 'self' data:;
              font-src 'self';
              connect-src 'self' https://${Api}.execute-api.${AWS::Region}.amazonaws.com https://cognito-idp.${AWS::Region}.amazonaws.com https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com;
              form-action 'self' https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com;
              frame-ancestors 'none';
              base-uri 'self';
              object-src 'none'
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: true
          ContentTypeOptions: { Override: true }
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: strict-origin-when-cross-origin
          FrameOptions:
            Override: true
            FrameOption: DENY

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Donaciones seguras - SPA
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: web-s3
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: web-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref WebSecurityHeaders
        # Rutas de la SPA (React Router): S3 responde 403 a claves inexistentes.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0 }
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: { AWS: "*" }
            Action: "s3:*"
            Resource: [!GetAtt WebBucket.Arn, !Sub "${WebBucket.Arn}/*"]
            Condition:
              Bool: { aws:SecureTransport: "false" }

Outputs:
  ApiUrl:
    Description: URL base de la HTTP API (stage academic)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}"
  UserPoolId:
    Description: ID del user pool de Cognito
    Value: !Ref UserPool
  UserPoolIssuer:
    Description: Emisor (issuer) para el JWT authorizer
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  SpaClientId:
    Description: Client ID de la SPA (público, sin secreto)
    Value: !Ref SpaClient
  AdminCliClientId:
    Description: Client ID del cliente administrativo (enrolamiento TOTP)
    Value: !Ref AdminCliClient
  CognitoDomainUrl:
    Description: Dominio de managed login
    Value: !Sub "https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com"
  ProjectsTableName:
    Value: !Ref ProjectsTable
  DonationsTableName:
    Value: !Ref DonationsTable
  IdempotencyTableName:
    Value: !Ref IdempotencyTable
  AuditEventsTableName:
    Value: !Ref AuditEventsTable
  WebUrl:
    Description: URL HTTPS del frontend (CloudFront). Usarla como WebOrigin en el segundo despliegue.
    Value: !Sub "https://${WebDistribution.DomainName}"
  WebBucketName:
    Description: Bucket privado del frontend (vaciar antes de sam delete)
    Value: !Ref WebBucket
  WebDistributionId:
    Description: ID de la distribución CloudFront (invalidaciones)
    Value: !Ref WebDistribution
  AvpPolicyStoreId:
    Condition: UseAvp
    Description: Policy store de Verified Permissions (HU-12)
    Value: !Ref AvpPolicyStore
